# .github/workflows/alert-case.yml
#
# GitHub avvia i cron programmati in modo inaffidabile: con "ogni 15 minuti"
# molte esecuzioni vengono saltate. Qui parte UNA corsa all'ora (i cron orari
# sono molto più affidabili) e dentro quella corsa il controllo viene ripetuto
# quattro volte, a distanza di 15 minuti. Se un'ora venisse comunque saltata,
# quella successiva recupera da sola.

name: Alert case Stoccolma

on:
  schedule:
    - cron: "3 * * * *"     # ogni ora al minuto 3
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alert-case
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Controlla i portali ogni 15 minuti per un'ora
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          git config user.name "alert-bot"
          git config user.email "bot@users.noreply.github.com"
          for i in 1 2 3 4; do
            echo "::group::Controllo $i di 4"
            python stockholm_bot.py || echo "giro $i fallito, continuo"

            git add -A seen.json stato.json
            if ! git diff --staged --quiet; then
              git commit -m "aggiorna annunci visti (giro $i)"
              git pull --rebase --autostash || true
              git push || echo "push fallito, riprovo al giro successivo"
            fi
            echo "::endgroup::"

            if [ "$i" -lt 4 ]; then sleep 900; fi
          done
